name: Bug
description: Something doesn't work the way the docs say.
labels: ["bug"]
body:
  - type: input
    id: package
    attributes:
      label: Package and version
      placeholder: "@vxnsin/inkan 0.8.1"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      placeholder: "Node 24.2 on Linux"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: The smallest code that shows it
      description: A route or two and the request you sent is usually enough.
      render: ts
  - type: markdown
    attributes:
      value: "A security problem? Please don't file it here; see SECURITY.md and report it privately."
